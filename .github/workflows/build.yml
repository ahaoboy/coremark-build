name: build

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
    branches:
      - "main"
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash --noprofile --norc -CeEuo pipefail {0}

jobs:
  # Each job uploads its own package to the same "nightly" release.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    name: build-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      # Zig, the packaging tools and the toolchain cache are all handled by the
      # script itself (it talks to the Actions cache API via ACTIONS_CACHE_URL).
      - name: Build ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: bash build-musl.sh

      # Only the targets that can run natively on the runner are executed; the
      # aarch64 Linux build is cross-compiled and left unrun.
      - name: Run ${{ matrix.target }}
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          ./dist/coremark

      - name: release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "*.zip"
          allowUpdates: true
          tag: "nightly"
          name: "nightly"
          token: ${{ secrets.GITHUB_TOKEN }}
          commit: main
          replacesArtifacts: true

  build-msvc:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
    name: build-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      # The MSVC environment is set up by the script itself (vswhere + vcvars64).
      - name: Build ${{ matrix.target }}
        shell: powershell
        env:
          TARGET: ${{ matrix.target }}
        run: ./build-msvc.ps1

      - name: Run ${{ matrix.target }}
        shell: pwsh
        run: |
          ./dist/coremark.exe
      - name: release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "*.zip"
          allowUpdates: true
          tag: "nightly"
          name: "nightly"
          token: ${{ secrets.GITHUB_TOKEN }}
          commit: main
          replacesArtifacts: true

  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
    name: build-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      # clang, lipo and zip all ship with the macOS runner.
      - name: Build ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: bash build-macos.sh

      - name: Run ${{ matrix.target }}
        run: |
          ./dist/coremark

      - name: release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "*.zip"
          allowUpdates: true
          tag: "nightly"
          name: "nightly"
          token: ${{ secrets.GITHUB_TOKEN }}
          commit: main
          replacesArtifacts: true
